<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}學習監督器{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oxanium:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ css_version }}">
    {% if app_settings.render_math_enabled %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true,
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"],
        },
      };
    </script>
    {% endif %}
  </head>
  <body
    class="is-booting"
    data-page="{% block page_name %}app{% endblock %}"
    data-motion-level="{{ app_settings.motion_level }}"
    data-dashboard-density="{{ app_settings.dashboard_density }}"
    data-render-math="{% if app_settings.render_math_enabled %}true{% else %}false{% endif %}"
    data-study-material-theme="{{ app_settings.study_material_theme }}"
  >
    <div class="loader-screen" id="loader-screen" aria-hidden="true">
      <div class="loader-grid" aria-hidden="true"></div>
      <div class="loader-door loader-door-top"></div>
      <div class="loader-door loader-door-bottom"></div>
      <div class="loader-core">
        <div class="loader-topline">
          <p class="loader-kicker">本地學習中控台</p>
          <span class="loader-chip">僅限本機</span>
        </div>
        <h1 class="loader-title">
          <span>學習</span>
          <span>監督器</span>
        </h1>
        <p class="loader-copy">
          正在同步今天的任務、資源與複習序列，準備打開你的本地學習控制台。
        </p>
        <div class="loader-progress-track">
          <span class="loader-progress-fill" id="loader-progress-fill"></span>
        </div>
        <div class="loader-status-row">
          <span id="loader-status-label">正在同步任務總覽</span>
          <strong id="loader-progress-text">0%</strong>
        </div>
        <div class="loader-step-row">
          <span class="loader-step is-active" data-loader-step>匯入</span>
          <span class="loader-step" data-loader-step>排程</span>
          <span class="loader-step" data-loader-step>複習</span>
        </div>
      </div>
    </div>

    <div id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></div>
    <div class="noise-layer" aria-hidden="true"></div>
    <div class="scan-lines" aria-hidden="true"></div>
    <div class="viewport-frame" aria-hidden="true">
      <span class="frame-corner frame-corner-tl"></span>
      <span class="frame-corner frame-corner-tr"></span>
      <span class="frame-corner frame-corner-bl"></span>
      <span class="frame-corner frame-corner-br"></span>
    </div>

    <div class="page-shell">
      <header class="site-header" id="site-header">
        <div class="site-header-block">
          <a class="brand" href="/">
            <span class="brand-mark">LS</span>
            <span class="brand-copy">
              <strong>學習監督器</strong>
              <small>只給自己用的本地學習面板</small>
            </span>
          </a>
          <div class="header-status" aria-label="本地狀態">
            <span>localhost</span>
            <span>{{ today.isoformat() }}</span>
            <span>單人使用</span>
          </div>
        </div>

        <nav class="site-nav">
          <a href="/">儀表板</a>
          <a href="/resources/new">匯入資料</a>
          <a href="/settings">設定</a>
        </nav>
      </header>

      <main class="page-content">
        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    {% if app_settings.render_math_enabled %}
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endif %}
    <script src="{{ url_for('static', path='app.js') }}?v={{ js_version }}" defer></script>
  </body>
</html>
